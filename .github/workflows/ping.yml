name: Keep Render awake

on:
  schedule:
    # Cada 5 minutos mantiene despierto el servicio gratuito de Render
    # (se duerme tras ~15 min sin trafico externo).
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://kidyagenda.onrender.com/api/health)
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "El servicio no respondio 200" >&2
            exit 1
          fi